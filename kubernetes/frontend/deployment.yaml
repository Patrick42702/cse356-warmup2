# auth-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image:  us-east4-docker.pkg.dev/my-gcp-project-466212/video-app-repo/frontend-app:latest
          ports:
            - containerPort: 80
          imagePullPolicy: Always

