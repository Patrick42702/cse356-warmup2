# video-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-api
  template:
    metadata:
      labels:
        app: video-api
    spec:
      containers:
        - name: video-api
          image: us-east4-docker.pkg.dev/my-gcp-project-466212/video-app-repo/video-app:latest
          ports:
            - containerPort: 5001
          envFrom:
            - secretRef:
                name: video-api-secret
          imagePullPolicy: Always

