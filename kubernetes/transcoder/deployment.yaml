apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcoder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transcoder
  template:
    metadata:
      labels:
        app: transcoder
    spec:
      containers:
        - name: transcoder
          image: patrick42702/transcoder-video-app:1
          envFrom:
            - secretRef:
                name: transcoder-secret
          imagePullPolicy: Always
