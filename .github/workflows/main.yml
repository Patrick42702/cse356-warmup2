name: Build and Scan Services

on:
  push:
    branches:
      - 2025-refactor-main
    paths:
      - 'auth/**'
      - 'video/**'
      - 'transcoder/**'
      - 'frontend/**'

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          version: latest

      - name: Build and scan services
        run: |
          set -e
          for service in auth video transcoder frontend; do
            if [ -d "$service" ]; then
              echo "=== Building $service ==="
              docker build \
                --file $service/Dockerfile.prod \
                --tag $service-image:latest \
                $service

              echo "=== Scanning $service ==="
              trivy image --exit-code 1 --severity CRITICAL $service-image:latest
            fi
          done
